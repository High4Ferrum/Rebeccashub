<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}Rebecca Yener</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <a class="logo" href="{{ '/' | relative_url }}">RY<span>.</span></a>

    <button class="menu-button" type="button" aria-label="Open menu">Menu</button>

    <nav class="site-nav">
      <a class="{% if page.section == 'home' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
      <a class="{% if page.section == 'professional' %}active{% endif %}" href="{{ '/professional/' | relative_url }}">Professional</a>
      <a class="{% if page.section == 'sport' %}active{% endif %}" href="{{ '/sport/' | relative_url }}">Sport</a>
      <a class="{% if page.section == 'side-hustle' %}active{% endif %}" href="{{ '/side-hustle/' | relative_url }}">Side Hustle</a>
      <a class="{% if page.section == 'real-estate' %}active{% endif %}" href="{{ '/real-estate/' | relative_url }}">Real Estate</a>
      <a class="{% if page.section == 'photography' %}active{% endif %}" href="{{ '/photography/' | relative_url }}">Photography</a>
      <a class="{% if page.section == 'things' %}active{% endif %}" href="{{ '/things-i-like/' | relative_url }}">Things I Like</a>
      <a class="{% if page.section == 'contact' %}active{% endif %}" href="{{ '/contact/' | relative_url }}">Contact</a>
    </nav>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <p>© <span class="year"></span> Rebecca Yener</p>
    <a href="https://github.com/High4Ferrum" target="_blank" rel="noreferrer">GitHub ↗</a>
  </footer>

  <script src="{{ '/assets/js/site.js' | relative_url }}"></script>
</body>
</html>
