<div class="site-search">
  <form class="search-form wrap" role="search" action="{{ '/search/' | relative_url }}" method="get">
    <label for="site-search-input">Search the site</label>
    <div class="search-controls">
      <input id="site-search-input" type="search" name="q" placeholder="Search posts, recipes, and pages…" maxlength="200">
      <button type="submit">Search</button>
    </div>
  </form>
</div>
